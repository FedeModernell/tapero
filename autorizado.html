<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Autorizado — Ta, pero…</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="120x120" href="logo120.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<main>
  <p><a href="./">← Ta, pero…</a></p>
  <h1>Listo, autorizado.</h1>
  <div id="con-codigo" hidden>
    <p>Copiá este código y mandáselo al publicador (por el chat de Claude):</p>
    <p><code id="codigo" style="display:block;word-break:break-all;font-size:1.1rem;padding:14px;border-radius:10px;background:rgba(127,127,127,.15)"></code></p>
    <p><button id="copiar" type="button" style="font-size:1.1rem;padding:10px 18px">Copiar código</button> <span id="copiado"></span></p>
  </div>
  <p id="sin-codigo">Ya podés cerrar esta pestaña.</p>
</main>
<script>
  // El código viene en la dirección (?code=…): en el celular no se ve, así que se muestra acá para copiarlo
  // (dueño, 2026-10-24, autorizando TikTok desde el celular). No se envía a ningún lado.
  (function(){
    var q = new URLSearchParams(location.search), c = q.get("code");
    if(!c) return;
    document.getElementById("codigo").textContent = c;
    document.getElementById("con-codigo").hidden = false;
    document.getElementById("sin-codigo").hidden = true;
    document.getElementById("copiar").addEventListener("click", function(){
      navigator.clipboard.writeText(c).then(function(){ document.getElementById("copiado").textContent = "✓ Copiado"; });
    });
  })();
</script>
</body>
</html>
